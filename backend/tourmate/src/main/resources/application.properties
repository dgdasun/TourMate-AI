spring.application.name=tourmate

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/tourmate_ai?createDatabaseIfNotExist=true&serverTimezone=Asia/Colombo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:2002}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:9090}

# ===============================
# TourMate AI
# ===============================
# Claude API key - leave empty to run the AI features in offline mode.
# Prefer setting the ANTHROPIC_API_KEY environment variable instead of writing the key here.
tourmate.ai.api-key=${ANTHROPIC_API_KEY:}
tourmate.ai.model=claude-opus-5-5
tourmate.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4000,http://127.0.0.1:4000}

# ===============================
# Authentication (JWT)
# ===============================
# Set JWT_SECRET (32+ random characters) in production; the default is for local development only.
tourmate.jwt.secret=${JWT_SECRET:tourmate-dev-secret-change-me-in-production-please-32+}
tourmate.jwt.expiry-hours=24
